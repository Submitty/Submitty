[tool.ruff.format]

[tool.ruff.lint]
# E/W = pycodestyle, F = pyflakes, B = flake8-bugbear, PL = pylint
select = ["E", "W", "F", "B", "PL"]
ignore = [
    "E203",  # whitespace before ':' (conflicts with the formatter)
    "E501",  # line-too-long; not enforced
    "B9",  # flake8-bugbear's "opinionated" B9xx checks are opt-in
    "PLR0912",  # too-many-branches
    "PLR0913",  # too-many-arguments
    "PLR0914",  # too-many-locals
    "PLW1514",  # unspecified-encoding
]

