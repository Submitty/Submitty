name: Vagrant Up

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vagrant-up:
    runs-on: macos-15-intel

    steps:
      - uses: actions/checkout@v7
      - run: brew install --cask vagrant
      - name: install virtual box 7.0.20
        run: |
          curl -LO https://download.virtualbox.org/virtualbox/7.0.20/VirtualBox-7.0.20-163906-OSX.dmg
          hdiutil mount VirtualBox-7.0.20-163906-OSX.dmg
          sudo installer -pkg /Volumes/VirtualBox/VirtualBox.pkg -target /
          hdiutil unmount /Volumes/VirtualBox
      # Installing this is skipped in CI as using it was causing some corruption in
      # attempting to mount the shared folder. The guest and host guest additions
      # versions are close enough that we are fine without it.
      # - run: vagrant plugin install vagrant-vbguest
      - run: NO_SUBMISSIONS=1 vagrant up ubuntu-22.04
      - name: Validate image
        run: curl --show-error --fail --include http://localhost:1511
      - name: Acquire Job ID
        if: failure()
        id: get-job-id
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUNNER_NAME: ${{ runner.name }}
        run: |
          jobs=$(gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}/attempts/${RUN_ATTEMPT}/jobs")
          job_id=$(echo "$jobs" | jq -r --arg name "$RUNNER_NAME" '.jobs[] | select(.runner_name==$name) | .id')
          echo "job_id=$job_id" >> $GITHUB_OUTPUT
      - name: Send zulip message on failure
        if: failure()
        env:
          ZULIP_AUTHENTICATION: ${{ secrets.ZULIP_AUTHENTICATION }}
          RUN_ID: ${{ github.run_id }}
          JOB_ID: ${{ steps.get-job-id.outputs.job_id }}
        run: |
         curl -X POST https://submitty.zulipchat.com/api/v1/messages -u "$ZULIP_AUTHENTICATION" --data-urlencode 'type=stream' --data-urlencode 'to=Submitty Developer Studio' --data-urlencode 'topic=Vagrant Up Failures' --data-urlencode "content=The Vagrant Up Github Action has failed. View here: https://github.com/Submitty/Submitty/actions/runs/$RUN_ID/job/$JOB_ID"
